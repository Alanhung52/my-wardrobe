<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wardrobe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入拖曳排序庫 SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        .bg-uq { background-color: #E60012; }
        .bg-gu { background-color: #002244; }
        .text-gu-yellow { color: #FFDD00; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .sortable-ghost { opacity: 0.4; border: 2px dashed #E60012; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 pb-28">

    <!-- Header -->
    <header class="bg-uq text-white p-4 text-center font-black text-xl tracking-widest shadow-md sticky top-0 z-40">
        MY WARDROBE
    </header>

    <main class="max-w-md mx-auto p-3">
        
        <!-- ================= 頁面 1：檢視庫存 ================= -->
        <div id="tabInventory" class="space-y-3">
            <div class="bg-white rounded-lg shadow-sm p-3 border border-gray-200 space-y-2">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="搜尋品名、品牌或顏色..." class="w-full bg-gray-50 border border-gray-200 rounded-full py-2 px-4 text-xs focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                
                <div id="categoryFilterBar" class="flex space-x-2 overflow-x-auto no-scrollbar py-1"></div>
            </div>

            <div id="wardrobeList" class="grid grid-cols-2 gap-2.5">
                <div class="col-span-2 text-center py-8 text-gray-400 text-sm">雲端資料載入中...</div>
            </div>
        </div>

        <!-- ================= 頁面 2：新增單品 ================= -->
        <div id="tabAdd" class="hidden">
            <div class="bg-white rounded-lg shadow-sm p-4 border border-gray-200">
                <h2 class="font-bold text-base mb-3 border-b-2 border-red-600 pb-1">新增單品 / 尺寸資料</h2>
                
                <form id="itemForm" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">品牌</label>
                        <select id="brandSelect" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-red-500 outline-none">
                            <option value="UNIQLO">UNIQLO</option>
                            <option value="GU">GU</option>
                            <option value="Other">其他品牌</option>
                        </select>
                        <input type="text" id="customBrand" placeholder="請輸入品牌名稱" class="w-full border rounded p-2 text-sm mt-2 hidden">
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div class="col-span-2">
                            <label class="block text-xs font-bold text-gray-600 mb-1">品名 / 貨號</label>
                            <input type="text" id="name" placeholder="例：寬版圓領 T 恤 (#465185)" class="w-full border rounded p-2 text-sm" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">顏色</label>
                            <input type="text" id="color" placeholder="例：黑色 / 09" class="w-full border rounded p-2 text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">類別</label>
                            <select id="categorySelect" class="w-full border rounded p-2 text-sm"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">標籤尺寸</label>
                            <input type="text" id="size" placeholder="例：L / M / 30" class="w-full border rounded p-2 text-sm">
                        </div>
                    </div>

                    <div class="bg-gray-50 p-3 rounded border border-gray-200">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-gray-700">精確尺寸紀錄 (cm)</span>
                            <button type="button" id="addSizeBtn" class="text-xs text-red-600 font-bold hover:underline">+ 增加尺寸部位</button>
                        </div>
                        <div id="sizeFieldsContainer" class="space-y-2"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">衣服照片 (上傳圖片 或 貼上網址)</label>
                        <input type="file" id="imageFileInput" accept="image/*" multiple class="w-full text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 mb-2">
                        <div id="urlContainer" class="space-y-2">
                            <input type="url" class="img-url-input w-full border rounded p-2 text-sm" placeholder="貼上圖片網址">
                        </div>
                        <button type="button" id="addUrlBtn" class="text-xs text-red-600 font-bold hover:underline mt-1 mb-2">+ 增加網址</button>

                        <!-- 即時預覽與拖曳排序區 -->
                        <div class="bg-gray-50 p-2.5 rounded border border-gray-200 space-y-1">
                            <div class="flex justify-between items-center">
                                <span class="text-[11px] font-bold text-gray-600">圖片即時預覽 (長按圖片可拖曳排序)</span>
                                <span class="text-[10px] text-gray-400">第一張為封面圖</span>
                            </div>
                            <div id="addPreviewContainer" class="flex flex-wrap gap-2 min-h-[60px] p-1 bg-white border border-dashed rounded items-center">
                                <span class="text-xs text-gray-400 mx-auto select-none">尚未選擇圖片</span>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-uq text-white font-bold py-2.5 rounded hover:opacity-90 transition text-sm shadow">
                        上傳儲存至雲端衣櫥
                    </button>
                </form>
            </div>
        </div>

    </main>

    <!-- 底部 Tab 導覽列 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center z-50 max-w-md mx-auto shadow-lg">
        <button id="navInventoryBtn" class="flex-1 py-4 text-center text-red-600 font-black text-base tracking-widest active:bg-gray-50 transition">
            檢視庫存
        </button>
        <div class="w-px bg-gray-200 h-8"></div>
        <button id="navAddBtn" class="flex-1 py-4 text-center text-gray-500 font-bold text-base tracking-widest active:bg-gray-50 transition">
            + 新增單品
        </button>
    </nav>

    <!-- 編輯 Modal 彈出視窗 -->
    <div id="editModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-lg p-4 w-full max-w-sm max-h-[90vh] overflow-y-auto space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-gray-800">編輯衣物資料</h3>
                <button id="closeEditModal" class="text-gray-400 hover:text-black font-bold">✕</button>
            </div>
            <form id="editForm" class="space-y-3 text-xs">
                <input type="hidden" id="editItemId">
                <div>
                    <label class="font-bold text-gray-600">品名</label>
                    <input type="text" id="editName" class="w-full border rounded p-1.5 mt-1" required>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="font-bold text-gray-600">顏色</label>
                        <input type="text" id="editColor" class="w-full border rounded p-1.5 mt-1">
                    </div>
                    <div>
                        <label class="font-bold text-gray-600">標籤尺寸</label>
                        <input type="text" id="editSize" class="w-full border rounded p-1.5 mt-1">
                    </div>
                </div>
                <div>
                    <label class="font-bold text-gray-600">類別</label>
                    <select id="editCategorySelect" class="w-full border rounded p-1.5 mt-1"></select>
                </div>
                <div class="bg-gray-50 p-2 rounded border space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-gray-700">尺寸數據 (cm)</span>
                        <button type="button" id="addEditSizeBtn" class="text-red-600 font-bold">+ 增加部位</button>
                    </div>
                    <div id="editSizeContainer" class="space-y-1.5"></div>
                </div>
                <div>
                    <label class="font-bold text-gray-600">圖片管理 (長按可拖曳調換順序)</label>
                    <input type="file" id="editImageFileInput" accept="image/*" multiple class="w-full mt-1">
                    <div id="editUrlContainer" class="space-y-1 mt-1">
                        <input type="url" class="edit-img-url-input w-full border rounded p-1.5" placeholder="貼上新圖片網址">
                    </div>
                    <button type="button" id="addEditUrlBtn" class="text-xs text-red-600 font-bold hover:underline mt-1 mb-2">+ 增加網址</button>
                    
                    <div id="editImagesContainer" class="flex flex-wrap gap-2 p-2 bg-gray-50 border rounded min-h-[60px] items-center">
                        <!-- 編輯預覽與拖曳區域 -->
                    </div>
                </div>
                <button type="submit" class="w-full bg-uq text-white font-bold py-2 rounded text-sm shadow">更新資料</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBwF163OMp-1sPCV9xHsORYemEy97YPCkI",
            authDomain: "mywardrobe-c7e74.firebaseapp.com",
            databaseURL: "https://mywardrobe-c7e74-default-rtdb.firebaseio.com",
            projectId: "mywardrobe-c7e74",
            storageBucket: "mywardrobe-c7e74.firebasestorage.app",
            messagingSenderId: "629621991380",
            appId: "1:629621991380:web:5ab788261e3ec50a79d841",
            measurementId: "G-MX1LL0RT99"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const wardrobeRef = ref(db, 'wardrobe');

        let categories = ["外套類", "T恤/休閒", "短袖/背心", "POLO衫", "襯衫", "針織衫/開襟外套", "下身類(褲子)", "牛仔褲", "內衣/褲子/襪子", "家居系列", "配件類"];
        let sizeOptions = ["衣長 / 總長", "肩寬", "胸寬", "連肩袖長", "腰圍", "臀圍", "股上 (褲檔)", "股下 (褲長)", "腿圍"];

        let allData = {};
        let currentCategoryFilter = "ALL";
        let currentSearchQuery = "";
        
        let addImageList = []; // 新頁面圖片陣列 ({id, src})
        let editImageList = []; // 編輯頁面圖片陣列 ({id, src})

        // 初始化 SortableJS 拖曳排序
        const addPreviewContainer = document.getElementById('addPreviewContainer');
        const editImagesContainer = document.getElementById('editImagesContainer');

        new Sortable(addPreviewContainer, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: () => syncImageListFromDOM('add')
        });

        new Sortable(editImagesContainer, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: () => syncImageListFromDOM('edit')
        });

        function syncImageListFromDOM(type) {
            const container = type === 'add' ? addPreviewContainer : editImagesContainer;
            const items = container.querySelectorAll('.img-preview-item');
            const newArr = [];
            items.forEach(el => {
                const src = el.getAttribute('data-src');
                if (src) newArr.push(src);
            });
            if (type === 'add') addImageList = newArr;
            else editImageList = newArr;
        }

        // Tab 切換
        const tabInventory = document.getElementById('tabInventory');
        const tabAdd = document.getElementById('tabAdd');
        const navInventoryBtn = document.getElementById('navInventoryBtn');
        const navAddBtn = document.getElementById('navAddBtn');

        navInventoryBtn.addEventListener('click', () => {
            tabInventory.classList.remove('hidden');
            tabAdd.classList.add('hidden');
            navInventoryBtn.className = "flex-1 py-4 text-center text-red-600 font-black text-base tracking-widest active:bg-gray-50 transition";
            navAddBtn.className = "flex-1 py-4 text-center text-gray-500 font-bold text-base tracking-widest active:bg-gray-50 transition";
        });

        navAddBtn.addEventListener('click', () => {
            tabAdd.classList.remove('hidden');
            tabInventory.classList.add('hidden');
            navAddBtn.className = "flex-1 py-4 text-center text-red-600 font-black text-base tracking-widest active:bg-gray-50 transition";
            navInventoryBtn.className = "flex-1 py-4 text-center text-gray-500 font-bold text-base tracking-widest active:bg-gray-50 transition";
        });

        // 圖片預覽渲染 (通用)
        function renderPreviewList(type) {
            const container = type === 'add' ? addPreviewContainer : editImagesContainer;
            const list = type === 'add' ? addImageList : editImageList;
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<span class="text-xs text-gray-400 mx-auto select-none">無圖片</span>`;
                return;
            }

            list.forEach((src, idx) => {
                const item = document.createElement('div');
                item.className = "img-preview-item relative w-14 h-14 border rounded overflow-hidden cursor-move bg-gray-100 flex-shrink-0 shadow-sm";
                item.setAttribute('data-src', src);
                item.innerHTML = `
                    <img src="${src}" class="w-full h-full object-cover pointer-events-none">
                    <button type="button" class="absolute top-0 right-0 bg-black/60 hover:bg-red-600 text-white w-4 h-4 text-[10px] flex items-center justify-center font-bold" onclick="removeImage('${type}', ${idx})">✕</button>
                    ${idx === 0 ? '<span class="absolute bottom-0 left-0 right-0 bg-red-600 text-white text-[9px] text-center font-bold py-0.5">封面</span>' : ''}
                `;
                container.appendChild(item);
            });
        }

        window.removeImage = function(type, index) {
            if (type === 'add') {
                addImageList.splice(index, 1);
                renderPreviewList('add');
            } else {
                editImageList.splice(index, 1);
                renderPreviewList('edit');
            }
        };

        // 檔案與網址變更事件 - 新增單品
        document.getElementById('imageFileInput').addEventListener('change', async (e) => {
            if (e.target.files && e.target.files.length > 0) {
                for (let file of e.target.files) {
                    const compressed = await processImageFile(file);
                    addImageList.push(compressed);
                }
                renderPreviewList('add');
                e.target.value = '';
            }
        });

        document.getElementById('urlContainer').addEventListener('change', (e) => {
            if (e.target.classList.contains('img-url-input') && e.target.value.trim()) {
                addImageList.push(e.target.value.trim());
                renderPreviewList('add');
                e.target.value = '';
            }
        });

        document.getElementById('addUrlBtn').addEventListener('click', () => {
            const container = document.getElementById('urlContainer');
            const input = document.createElement('input');
            input.type = 'url';
            input.className = 'img-url-input w-full border rounded p-2 text-sm mt-2';
            input.placeholder = '貼上圖片網址';
            container.appendChild(input);
        });

        // 檔案與網址變更事件 - 編輯單品
        document.getElementById('editImageFileInput').addEventListener('change', async (e) => {
            if (e.target.files && e.target.files.length > 0) {
                for (let file of e.target.files) {
                    const compressed = await processImageFile(file);
                    editImageList.push(compressed);
                }
                renderPreviewList('edit');
                e.target.value = '';
            }
        });

        document.getElementById('editUrlContainer').addEventListener('change', (e) => {
            if (e.target.classList.contains('edit-img-url-input') && e.target.value.trim()) {
                editImageList.push(e.target.value.trim());
                renderPreviewList('edit');
                e.target.value = '';
            }
        });

        document.getElementById('addEditUrlBtn').addEventListener('click', () => {
            const container = document.getElementById('editUrlContainer');
            const input = document.createElement('input');
            input.type = 'url';
            input.className = 'edit-img-url-input w-full border rounded p-1.5 mt-1';
            input.placeholder = '貼上新圖片網址';
            container.appendChild(input);
        });

        // 類別與品牌
        function renderCategorySelects() {
            const optionsHtml = categories.map(c => `<option value="${c}">${c}</option>`).join('') + `<option value="ADD_NEW">+ 新增自訂類別...</option>`;
            document.getElementById('categorySelect').innerHTML = optionsHtml;
            document.getElementById('editCategorySelect').innerHTML = optionsHtml;
        }

        document.getElementById('categorySelect').addEventListener('change', (e) => handleCategoryAdd(e));
        document.getElementById('editCategorySelect').addEventListener('change', (e) => handleCategoryAdd(e));

        function handleCategoryAdd(e) {
            if (e.target.value === 'ADD_NEW') {
                const newCat = prompt('請輸入新的類別名稱：');
                if (newCat && newCat.trim() !== '') {
                    const trimmed = newCat.trim();
                    if (!categories.includes(trimmed)) categories.push(trimmed);
                    renderCategorySelects();
                    renderCategoryFilterBar();
                    e.target.value = trimmed;
                } else {
                    e.target.value = categories[0];
                }
            }
        }

        function renderCategoryFilterBar() {
            const bar = document.getElementById('categoryFilterBar');
            let html = `<button data-cat="ALL" class="cat-filter-btn px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap ${currentCategoryFilter === 'ALL' ? 'bg-uq text-white' : 'bg-gray-100 text-gray-600'} shadow-sm">全部單品</button>`;
            categories.forEach(c => {
                const active = currentCategoryFilter === c;
                html += `<button data-cat="${c}" class="cat-filter-btn px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap ${active ? 'bg-uq text-white' : 'bg-gray-100 text-gray-600'} shadow-sm">${c}</button>`;
            });
            bar.innerHTML = html;
            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentCategoryFilter = btn.getAttribute('data-cat');
                    renderCategoryFilterBar();
                    renderList();
                });
            });
        }

        const brandSelect = document.getElementById('brandSelect');
        const customBrandInput = document.getElementById('customBrand');
        brandSelect.addEventListener('change', () => {
            if (brandSelect.value === 'Other') customBrandInput.classList.remove('hidden');
            else customBrandInput.classList.add('hidden');
        });

        // 尺寸輸入
        function createSizeRow(container, defaultType = sizeOptions[0], defaultValue = "") {
            const row = document.createElement('div');
            row.className = "flex items-center space-x-2 size-row";
            let optionsHtml = sizeOptions.map(opt => `<option value="${opt}" ${opt === defaultType ? 'selected' : ''}>${opt}</option>`).join('') + `<option value="ADD_NEW">+ 自訂部位...</option>`;
            
            row.innerHTML = `
                <select class="size-type border rounded p-1.5 text-xs w-1/2 bg-white">${optionsHtml}</select>
                <input type="number" step="0.1" value="${defaultValue}" placeholder="公分 (cm)" class="size-value border rounded p-1.5 text-xs w-1/2">
                <button type="button" class="remove-size-btn text-gray-400 hover:text-red-500 font-bold px-1 text-sm">✕</button>
            `;

            row.querySelector('.size-type').addEventListener('change', (e) => {
                if (e.target.value === 'ADD_NEW') {
                    const newType = prompt('請輸入自訂部位名稱：');
                    if (newType && newType.trim() !== '') {
                        const trimmed = newType.trim();
                        if (!sizeOptions.includes(trimmed)) sizeOptions.push(trimmed);
                        e.target.innerHTML = sizeOptions.map(opt => `<option value="${opt}" ${opt === trimmed ? 'selected' : ''}>${opt}</option>`).join('') + `<option value="ADD_NEW">+ 自訂部位...</option>`;
                    } else {
                        e.target.value = sizeOptions[0];
                    }
                }
            });

            row.querySelector('.remove-size-btn').addEventListener('click', () => row.remove());
            container.appendChild(row);
        }

        document.getElementById('addSizeBtn').addEventListener('click', () => createSizeRow(document.getElementById('sizeFieldsContainer')));
        document.getElementById('addEditSizeBtn').addEventListener('click', () => createSizeRow(document.getElementById('editSizeContainer')));

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearchQuery = e.target.value.toLowerCase().trim();
            renderList();
        });

        // 渲染列表
        function renderList() {
            const listDiv = document.getElementById('wardrobeList');
            listDiv.innerHTML = '';

            if (!allData || Object.keys(allData).length === 0) {
                listDiv.innerHTML = `<div class="col-span-2 text-center py-8 text-gray-400 text-sm">目前衣櫥是空的，請新增單品！</div>`;
                return;
            }

            let filteredKeys = Object.keys(allData).filter(id => {
                const item = allData[id];
                const matchCat = currentCategoryFilter === 'ALL' || item.category === currentCategoryFilter;
                const matchQuery = !currentSearchQuery || 
                    (item.name && item.name.toLowerCase().includes(currentSearchQuery)) ||
                    (item.brand && item.brand.toLowerCase().includes(currentSearchQuery)) ||
                    (item.color && item.color.toLowerCase().includes(currentSearchQuery));
                return matchCat && matchQuery;
            });

            if (filteredKeys.length === 0) {
                listDiv.innerHTML = `<div class="col-span-2 text-center py-8 text-gray-400 text-sm">找不到符合條件的單品</div>`;
                return;
            }

            filteredKeys.forEach((id) => {
                const item = allData[id];
                let brandBadge = item.brand === 'UNIQLO' ? `<span class="bg-uq text-white px-1.5 py-0.5 text-[10px] font-bold rounded">UNIQLO</span>` :
                                item.brand === 'GU' ? `<span class="bg-gu text-gu-yellow px-1.5 py-0.5 text-[10px] font-bold rounded">GU</span>` :
                                `<span class="bg-gray-700 text-white px-1.5 py-0.5 text-[10px] font-bold rounded">${item.brand}</span>`;

                let sizesHtml = item.customSizes && item.customSizes.length > 0 ? 
                    item.customSizes.map(s => `<span class="bg-gray-100 text-gray-700 px-1 py-0.5 text-[10px] rounded">${s.type}:${s.val}cm</span>`).join('') :
                    `<span class="text-gray-400 text-[10px]">無尺寸細節</span>`;

                let images = [];
                if (item.images && Array.isArray(item.images) && item.images.length > 0) {
                    images = item.images;
                } else if (item.imgData) {
                    images = [item.imgData];
                }

                let carouselHtml = '';
                if (images.length > 0) {
                    carouselHtml = `
                        <div class="w-full bg-gray-100 aspect-[3/4] relative overflow-hidden group">
                            <div class="carousel-track flex w-full h-full overflow-x-auto snap-x snap-mandatory no-scrollbar" onscroll="updateDots(this)">
                                ${images.map(img => `<img src="${img}" class="w-full h-full object-cover flex-shrink-0 snap-start" alt="${item.name}">`).join('')}
                            </div>
                            ${images.length > 1 ? `
                                <div class="carousel-dots absolute bottom-1.5 left-0 right-0 flex justify-center space-x-1 pointer-events-none">
                                    ${images.map((_, idx) => `<div class="dot w-1.5 h-1.5 rounded-full ${idx === 0 ? 'bg-white' : 'bg-white/50'} shadow-sm"></div>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    carouselHtml = `<div class="w-full bg-gray-100 aspect-[3/4] flex items-center justify-center text-gray-300 text-xs">無照片</div>`;
                }

                const card = document.createElement('div');
                card.className = "bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        ${carouselHtml}
                        <div class="p-2 space-y-1">
                            <div class="flex justify-between items-center">
                                ${brandBadge}
                                <span class="text-[10px] text-gray-500 font-bold">${item.category} (${item.size || 'F'})</span>
                            </div>
                            <h3 class="font-bold text-xs text-gray-900 line-clamp-2 leading-snug" title="${item.name}">${item.name}</h3>
                            ${item.color ? `<div class="text-[10px] text-gray-500">顏色：${item.color}</div>` : ''}
                            <div class="flex flex-wrap gap-1 pt-1">
                                ${sizesHtml}
                            </div>
                        </div>
                    </div>
                    <div class="p-2 pt-0 flex justify-between items-center text-[11px] border-t border-gray-50 mt-1">
                        <button data-id="${id}" class="edit-btn text-gray-500 hover:text-black font-bold">編輯</button>
                        <button data-id="${id}" class="delete-btn text-red-500 hover:underline">刪除</button>
                    </div>
                `;
                listDiv.appendChild(card);
            });

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => openEditModal(e.target.getAttribute('data-id')));
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (confirm('確定要刪除這件衣服嗎？')) remove(ref(db, `wardrobe/${id}`));
                });
            });
        }

        window.updateDots = function(el) {
            const index = Math.round(el.scrollLeft / el.clientWidth);
            const dots = el.parentElement.querySelectorAll('.dot');
            dots.forEach((dot, idx) => {
                dot.className = idx === index ? "dot w-1.5 h-1.5 rounded-full bg-white shadow-sm" : "dot w-1.5 h-1.5 rounded-full bg-white/50 shadow-sm";
            });
        }

        // 開啟編輯 Modal
        function openEditModal(id) {
            const item = allData[id];
            if (!item) return;

            document.getElementById('editItemId').value = id;
            document.getElementById('editName').value = item.name || '';
            document.getElementById('editColor').value = item.color || '';
            document.getElementById('editSize').value = item.size || '';
            document.getElementById('editCategorySelect').value = item.category || categories[0];

            editImageList = item.images && item.images.length > 0 ? [...item.images] : (item.imgData ? [item.imgData] : []);
            renderPreviewList('edit');

            const editSizeContainer = document.getElementById('editSizeContainer');
            editSizeContainer.innerHTML = '';
            if (item.customSizes && item.customSizes.length > 0) {
                item.customSizes.forEach(s => createSizeRow(editSizeContainer, s.type, s.val));
            } else {
                createSizeRow(editSizeContainer);
            }

            document.getElementById('editModal').classList.remove('hidden');
        }

        document.getElementById('closeEditModal').addEventListener('click', () => {
            document.getElementById('editModal').classList.add('hidden');
        });

        // 圖片壓縮
        function processImageFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height, maxSide = 800;
                        if (width > height && width > maxSide) { height = (height * maxSide) / width; width = maxSide; }
                        else if (height > maxSide) { width = (width * maxSide) / height; height = maxSide; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 監聽雲端資料
        onValue(wardrobeRef, (snapshot) => {
            allData = snapshot.val() || {};
            renderList();
        });

        // 初始化
        renderCategorySelects();
        renderCategoryFilterBar();
        createSizeRow(document.getElementById('sizeFieldsContainer'));

        // 新增送出
        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            syncImageListFromDOM('add');

            let finalBrand = brandSelect.value === 'Other' ? (customBrandInput.value.trim() || '其他品牌') : brandSelect.value;
            const customSizes = [];
            document.querySelectorAll('#sizeFieldsContainer .size-row').forEach(row => {
                const type = row.querySelector('.size-type').value;
                const val = row.querySelector('.size-value').value;
                if (val && type !== 'ADD_NEW') customSizes.push({ type, val });
            });

            const newItem = {
                brand: finalBrand,
                name: document.getElementById('name').value,
                color: document.getElementById('color').value,
                category: document.getElementById('categorySelect').value,
                size: document.getElementById('size').value,
                customSizes: customSizes,
                images: addImageList,
                createdAt: Date.now()
            };

            push(wardrobeRef, newItem).then(() => {
                e.target.reset();
                addImageList = [];
                renderPreviewList('add');
                document.getElementById('sizeFieldsContainer').innerHTML = '';
                document.getElementById('urlContainer').innerHTML = '<input type="url" class="img-url-input w-full border rounded p-2 text-sm" placeholder="貼上圖片網址">';
                createSizeRow(document.getElementById('sizeFieldsContainer'));
                customBrandInput.classList.add('hidden');
                navInventoryBtn.click();
            });
        });

        // 編輯送出
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            syncImageListFromDOM('edit');

            const id = document.getElementById('editItemId').value;
            const customSizes = [];
            document.querySelectorAll('#editSizeContainer .size-row').forEach(row => {
                const type = row.querySelector('.size-type').value;
                const val = row.querySelector('.size-value').value;
                if (val && type !== 'ADD_NEW') customSizes.push({ type, val });
            });

            let updatedData = {
                name: document.getElementById('editName').value,
                color: document.getElementById('editColor').value,
                size: document.getElementById('editSize').value,
                category: document.getElementById('editCategorySelect').value,
                customSizes: customSizes,
                images: editImageList
            };

            update(ref(db, `wardrobe/${id}`), updatedData).then(() => {
                document.getElementById('editModal').classList.add('hidden');
            });
        });
    </script>
</body>
</html>
